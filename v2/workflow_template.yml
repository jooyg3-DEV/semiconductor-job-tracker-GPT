name: job-tracker-blindspot-v2

on:
  schedule:
    - cron: '20 23 * * 0,2,4'
  workflow_dispatch:
    inputs:
      company:
        description: 'Optional company substring for focused debug'
        required: false
        type: string

concurrency:
  group: job-tracker-blindspot-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt
          playwright install --with-deps chromium
      - name: Collect public job snapshots
        run: |
          if [ -n "${{ inputs.company }}" ]; then
            python v2/main.py --company "${{ inputs.company }}"
          else
            python v2/main.py
          fi
      - name: Upload snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blindspot-v2-${{ github.run_id }}
          path: |
            v2/data/latest_snapshot.json
            v2/data/latest_status.json
            v2/data/latest_run.json
            debug_outputs/*.json
          if-no-files-found: warn
          retention-days: 30
